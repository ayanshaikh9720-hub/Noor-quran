<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded geometry -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer decorative Islamic border ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.35"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#gold)" stroke-width="2" stroke-dasharray="8 8" opacity="0.5"/>

  <!-- Open Quran Book Illustration -->
  <g transform="translate(116, 170)">
    <!-- Left Page -->
    <path d="M140 20 C100 0, 30 10, 0 35 L0 180 C30 155, 100 145, 140 165 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Right Page -->
    <path d="M140 20 C180 0, 250 10, 280 35 L280 180 C250 155, 180 145, 140 165 Z" fill="#f8fafc" opacity="0.95"/>
    <!-- Book Spine / Bookstand -->
    <path d="M136 20 L144 20 L144 195 L136 195 Z" fill="url(#gold)"/>
    <!-- Page text lines hint -->
    <line x1="25" y1="65" x2="115" y2="65" stroke="#047857" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <line x1="25" y1="90" x2="115" y2="90" stroke="#047857" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <line x1="25" y1="115" x2="95" y2="115" stroke="#047857" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <line x1="25" y1="140" x2="115" y2="140" stroke="#047857" stroke-width="4" stroke-linecap="round" opacity="0.4"/>

    <line x1="165" y1="65" x2="255" y2="65" stroke="#047857" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <line x1="165" y1="90" x2="255" y2="90" stroke="#047857" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <line x1="165" y1="115" x2="235" y2="115" stroke="#047857" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <line x1="165" y1="140" x2="255" y2="140" stroke="#047857" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Golden Radiant Light / Crescent above Quran -->
  <path d="M256 95 C230 95, 210 115, 210 140 C210 165, 230 185, 256 185 C242 178, 232 163, 232 140 C232 117, 242 102, 256 95 Z" fill="url(#gold)"/>
  <circle cx="266" cy="115" r="8" fill="url(#gold)"/>

  <!-- Noor Title in gold font -->
  <text x="256" y="420" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="bold" fill="#fef3c7" letter-spacing="4">NOOR QURAN</text>
  <text x="256" y="455" text-anchor="middle" font-family="'Amiri', serif" font-size="28" fill="url(#gold)">نُورُ الْقُرْآن</text>
</svg>
