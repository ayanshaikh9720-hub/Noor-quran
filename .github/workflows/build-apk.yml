name: Build Android APK (Free GitHub Runner)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Noor Quran APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Preinstalled Android SDK
        run: |
          echo "Setting up Android SDK environment..."
          # GitHub-hosted ubuntu runners have Android SDK preinstalled at $ANDROID_SDK_ROOT
          ANDROID_SDK_PATH="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_SDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_PATH" >> $GITHUB_ENV
          echo "$ANDROID_SDK_PATH/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_PATH/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_PATH/tools/bin" >> $GITHUB_PATH

          # Automatically accept all Android SDK licenses
          yes | "$ANDROID_SDK_PATH/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        working-directory: android
        run: |
          echo "Preparing gradlew executable..."
          chmod +x ./gradlew || true
          
          # Build Release and Debug APKs
          if [ -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew assembleRelease assembleDebug --stacktrace --no-daemon
          else
            gradle assembleRelease assembleDebug --stacktrace --no-daemon
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NoorQuran-Android-APK
          path: |
            android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
